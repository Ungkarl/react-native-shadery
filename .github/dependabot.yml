version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Expo Go ships fixed versions of these. They move together with the Expo SDK
    # (`yarn example expo install --fix`), never one at a time.
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-web"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "canvaskit-wasm"
